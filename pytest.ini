[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# The current Starlette TestClient emits this deprecation notice from
# inside the library itself. It is not a warning about this code, and
# filtering this one message keeps the test output clean to read.
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning
